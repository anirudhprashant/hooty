<svg width="800" height="500" xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 500' role='img' aria-label='Understanding area diagram'>
  <rect x='0' y='0' width='800' height='500' fill='#fff7e8'/>

  <g id='carpet-example' aria-label='Carpet floor area example'>
    <rect x='30' y='30' width='360' height='240' rx='18' fill='#ffffff' stroke='#2a1a4a' stroke-width='4'/>
    <text x='210' y='80' text-anchor='middle' font-family='sans-serif' font-size='30' font-weight='bold' fill='#2a1a4a'>Carpet floor: 20 m²</text>

    <rect x='300' y='95' width='80' height='100' fill='#ffb703' stroke='#2a1a4a' stroke-width='6'/>
    <rect x='300' y='95' width='60' height='60' fill='#3a86ff' stroke='#2a1a4a' stroke-width='6'/>
    <g stroke='#2a1a4a' stroke-width='4'>
      <line x1='320' y1='95' x2='320' y2='195'/>
      <line x1='340' y1='95' x2='340' y2='195'/>
      <line x1='360' y1='95' x2='360' y2='195'/>
      <line x1='300' y1='115' x2='380' y2='115'/>
      <line x1='300' y1='135' x2='380' y2='135'/>
      <line x1='300' y1='155' x2='380' y2='155'/>
      <line x1='300' y1='175' x2='380' y2='175'/>
    </g>
    <rect x='300' y='95' width='60' height='60' fill='none' stroke='#2a1a4a' stroke-width='6'/>

    <rect x='60' y='120' width='18' height='18' fill='#3a86ff' stroke='#2a1a4a' stroke-width='4'/>
    <text x='88' y='136' font-family='sans-serif' font-size='28' fill='#2a1a4a'>9 m² carpet</text>
    <rect x='60' y='160' width='18' height='18' fill='#ffb703' stroke='#2a1a4a' stroke-width='4'/>
    <text x='88' y='176' font-family='sans-serif' font-size='28' fill='#2a1a4a'>11 m² uncovered</text>
  </g>

  <g id='flower-bed-example' aria-label='Complete land and flower-bed area example'>
    <rect x='410' y='30' width='360' height='240' rx='18' fill='#ffffff' stroke='#2a1a4a' stroke-width='4'/>
    <text x='590' y='80' text-anchor='middle' font-family='sans-serif' font-size='30' font-weight='bold' fill='#2a1a4a'>Flower-bed land</text>

    <rect x='440' y='95' width='150' height='80' fill='#06a77d' stroke='#2a1a4a' stroke-width='6'/>
    <g fill='#ffb703' stroke='#2a1a4a' stroke-width='4'>
      <rect x='440' y='95' width='40' height='40'/>
      <rect x='480' y='95' width='40' height='40'/>
      <rect x='440' y='135' width='40' height='40'/>
      <rect x='480' y='135' width='40' height='40'/>
    </g>
    <g stroke='#2a1a4a' stroke-width='4'>
      <line x1='450' y1='95' x2='450' y2='135'/>
      <line x1='460' y1='95' x2='460' y2='135'/>
      <line x1='470' y1='95' x2='470' y2='135'/>
      <line x1='490' y1='95' x2='490' y2='135'/>
      <line x1='500' y1='95' x2='500' y2='135'/>
      <line x1='510' y1='95' x2='510' y2='135'/>
      <line x1='450' y1='105' x2='480' y2='105'/>
      <line x1='450' y1='115' x2='480' y2='115'/>
      <line x1='450' y1='125' x2='480' y2='125'/>
      <line x1='490' y1='105' x2='520' y2='105'/>
      <line x1='490' y1='115' x2='520' y2='115'/>
      <line x1='490' y1='125' x2='520' y2='125'/>
      <line x1='450' y1='145' x2='480' y2='145'/>
      <line x1='450' y1='155' x2='480' y2='155'/>
      <line x1='450' y1='165' x2='480' y2='165'/>
      <line x1='490' y1='145' x2='520' y2='145'/>
      <line x1='490' y1='155' x2='520' y2='155'/>
      <line x1='490' y1='165' x2='520' y2='165'/>
    </g>

    <text x='590' y='205' text-anchor='middle' font-family='sans-serif' font-size='28' fill='#2a1a4a'>120 = 64 + 56 m²</text>
    <text x='590' y='235' text-anchor='middle' font-family='sans-serif' font-size='28' fill='#2a1a4a'>4 × 16 = 64 m²</text>
  </g>

  <g id='area-methods' aria-label='Ways to find area'>
    <rect x='30' y='290' width='240' height='180' rx='18' fill='#ffffff' stroke='#2a1a4a' stroke-width='4'/>
    <text x='150' y='340' text-anchor='middle' font-family='sans-serif' font-size='30' font-weight='bold' fill='#2a1a4a'>Area methods</text>

    <rect x='55' y='365' width='54' height='36' fill='#ffb703' stroke='#2a1a4a' stroke-width='4'/>
    <g stroke='#2a1a4a' stroke-width='4'>
      <line x1='73' y1='365' x2='73' y2='401'/>
      <line x1='91' y1='365' x2='91' y2='401'/>
      <line x1='55' y1='383' x2='109' y2='383'/>
    </g>

    <rect x='125' y='365' width='80' height='36' fill='#3a86ff' stroke='#2a1a4a' stroke-width='6'/>
    <line x1='165' y1='365' x2='165' y2='401' stroke='#2a1a4a' stroke-width='4'/>

    <polygon points='215,435 245,435 230,365' fill='#8338ec' stroke='#2a1a4a' stroke-width='6' stroke-linejoin='round'/>
  </g>

  <g id='area-and-perimeter-comparisons' aria-label='Examples of equal areas with different perimeters and equal perimeters with different areas'>
    <rect x='280' y='290' width='490' height='180' rx='18' fill='#ffffff' stroke='#2a1a4a' stroke-width='4'/>
    <text x='525' y='340' text-anchor='middle' font-family='sans-serif' font-size='28' font-weight='bold' fill='#2a1a4a'>
      <tspan x='525' y='340'>Same area, different perimeters</tspan>
      <tspan x='525' y='372'>Same perimeter, different areas</tspan>
    </text>

    <rect x='320' y='390' width='54' height='54' fill='#3a86ff' stroke='#2a1a4a' stroke-width='6'/>
    <g stroke='#2a1a4a' stroke-width='4'>
      <line x1='338' y1='390' x2='338' y2='444'/>
      <line x1='356' y1='390' x2='356' y2='444'/>
      <line x1='320' y1='408' x2='374' y2='408'/>
      <line x1='320' y1='426' x2='374' y2='426'/>
    </g>

    <rect x='400' y='408' width='162' height='18' fill='#ff7a59' stroke='#2a1a4a' stroke-width='6'/>
    <g stroke='#2a1a4a' stroke-width='4'>
      <line x1='418' y1='408' x2='418' y2='426'/>
      <line x1='436' y1='408' x2='436' y2='426'/>
      <line x1='454' y1='408' x2='454' y2='426'/>
      <line x1='472' y1='408' x2='472' y2='426'/>
      <line x1='490' y1='408' x2='490' y2='426'/>
      <line x1='508' y1='408' x2='508' y2='426'/>
      <line x1='526' y1='408' x2='526' y2='426'/>
      <line x1='544' y1='408' x2='544' y2='426'/>
    </g>

    <line x1='580' y1='380' x2='580' y2='452' stroke='#2a1a4a' stroke-width='4'/>

    <rect x='600' y='390' width='54' height='54' fill='#06a77d' stroke='#2a1a4a' stroke-width='6'/>
    <g stroke='#2a1a4a' stroke-width='4'>
      <line x1='618' y1='390' x2='618' y2='444'/>
      <line x1='636' y1='390' x2='636' y2='444'/>
      <line x1='600' y1='408' x2='654' y2='408'/>
      <line x1='600' y1='426' x2='654' y2='426'/>
    </g>

    <rect x='670' y='399' width='90' height='18' fill='#8338ec' stroke='#2a1a4a' stroke-width='6'/>
    <g stroke='#2a1a4a' stroke-width='4'>
      <line x1='688' y1='399' x2='688' y2='417'/>
      <line x1='706' y1='399' x2='706' y2='417'/>
      <line x1='724' y1='399' x2='724' y2='417'/>
      <line x1='742' y1='399' x2='742' y2='417'/>
    </g>
  </g>
</svg>