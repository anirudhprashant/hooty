<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="sans-serif" fill="#2a1a4a">
  <rect x="0" y="0" width="800" height="500" fill="#fff7e8"/>

  <g>
    <text x="40" y="55" font-size="32" font-weight="bold">Lesson 3: Reading Bar Graphs</text>
  </g>

  <g>
    <text x="40" y="105" font-size="28" font-weight="bold">Horizontal and vertical bars</text>

    <line x1="60" y1="125" x2="60" y2="255" stroke="#2a1a4a" stroke-width="6"/>
    <rect x="60" y="135" width="220" height="32" rx="4" fill="#ff7a59" stroke="#2a1a4a" stroke-width="5"/>
    <rect x="60" y="180" width="170" height="32" rx="4" fill="#ffb703" stroke="#2a1a4a" stroke-width="5"/>
    <rect x="60" y="225" width="120" height="32" rx="4" fill="#06a77d" stroke="#2a1a4a" stroke-width="5"/>

    <line x1="60" y1="420" x2="270" y2="420" stroke="#2a1a4a" stroke-width="6"/>
    <rect x="90" y="290" width="58" height="130" rx="4" fill="#3a86ff" stroke="#2a1a4a" stroke-width="5"/>
    <rect x="190" y="335" width="58" height="85" rx="4" fill="#8338ec" stroke="#2a1a4a" stroke-width="5"/>
  </g>

  <g>
    <text x="405" y="95" font-size="28" font-weight="bold">Delhi traffic graph</text>

    <line x1="405" y1="123" x2="427" y2="123" stroke="#8338ec" stroke-width="5"/>
    <line x1="405" y1="116" x2="405" y2="130" stroke="#8338ec" stroke-width="5"/>
    <line x1="427" y1="116" x2="427" y2="130" stroke="#8338ec" stroke-width="5"/>
    <text x="438" y="134" font-size="28">1 unit = 100 vehicles</text>

    <g stroke="#8338ec" stroke-width="4" opacity="0.22">
      <line x1="420" y1="156" x2="760" y2="156"/>
      <line x1="420" y1="178" x2="760" y2="178"/>
      <line x1="420" y1="200" x2="760" y2="200"/>
      <line x1="420" y1="222" x2="760" y2="222"/>
      <line x1="420" y1="244" x2="760" y2="244"/>
      <line x1="420" y1="266" x2="760" y2="266"/>
      <line x1="420" y1="288" x2="760" y2="288"/>
      <line x1="420" y1="310" x2="760" y2="310"/>
      <line x1="420" y1="332" x2="760" y2="332"/>
      <line x1="420" y1="354" x2="760" y2="354"/>
      <line x1="420" y1="376" x2="760" y2="376"/>
      <line x1="420" y1="398" x2="760" y2="398"/>
    </g>

    <line x1="420" y1="156" x2="420" y2="420" stroke="#2a1a4a" stroke-width="6"/>
    <line x1="420" y1="420" x2="760" y2="420" stroke="#2a1a4a" stroke-width="6"/>

    <rect x="455" y="156" width="70" height="264" rx="4" fill="#ffb703" stroke="#2a1a4a" stroke-width="5"/>
    <rect x="655" y="387" width="70" height="33" rx="4" fill="#06a77d" stroke="#2a1a4a" stroke-width="5"/>

    <rect x="535" y="164" width="210" height="44" rx="6" fill="#fff7e8"/>
    <text x="542" y="196" font-size="28" font-weight="bold">Maximum: 1200</text>

    <rect x="535" y="340" width="185" height="44" rx="6" fill="#fff7e8"/>
    <text x="542" y="372" font-size="28" font-weight="bold">Minimum: 150</text>

    <text x="490" y="465" font-size="28" text-anchor="middle">7 to 8 a.m.</text>
    <text x="690" y="465" font-size="28" text-anchor="middle">6 to 7 a.m.</text>
  </g>
</svg>