<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">Divisibility Tests</title><desc id="diagram-desc">A colourful diagram showing ending-digit tests, the last two digits for divisibility by 4, the last three digits for divisibility by 8, and the leap year 2024 with 29 days in February.</desc><rect x="0" y="0" width="800" height="500" fill="#fff7e8"/><text x="400" y="39" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="700" fill="#2a1a4a">Divisibility Tests</text><text x="400" y="68" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#2a1a4a">No long division needed</text><g id="ending-tests"><rect x="24" y="84" width="752" height="104" rx="20" fill="#ffffff" stroke="#3a86ff" stroke-width="5"/><text font-family="sans-serif" font-size="28" fill="#2a1a4a"><tspan x="48" y="116">Endings: 10→0</tspan><tspan x="300" y="116">5→0 or 5</tspan><tspan x="490" y="116">2→0,2,4,6,8</tspan></text><g stroke="#2a1a4a" stroke-width="5"><rect x="48" y="137" width="20" height="20" fill="#ff7a59"/><rect x="74" y="137" width="20" height="20" fill="#ffb703"/><rect x="100" y="137" width="20" height="20" fill="#06a77d"/><rect x="126" y="137" width="20" height="20" fill="#8338ec"/><path d="M150 147 H190" fill="none"/><circle cx="218" cy="147" r="17" fill="#ff7a59"/></g><g stroke="#2a1a4a" stroke-width="5"><rect x="300" y="137" width="20" height="20" fill="#ff7a59"/><rect x="326" y="137" width="20" height="20" fill="#ffb703"/><rect x="352" y="137" width="20" height="20" fill="#06a77d"/><rect x="378" y="137" width="20" height="20" fill="#8338ec"/><path d="M402 147 H432" fill="none"/><circle cx="460" cy="147" r="17" fill="#8338ec"/></g><g stroke="#2a1a4a" stroke-width="5"><rect x="490" y="137" width="20" height="20" fill="#ff7a59"/><rect x="516" y="137" width="20" height="20" fill="#ffb703"/><rect x="542" y="137" width="20" height="20" fill="#06a77d"/><rect x="568" y="137" width="20" height="20" fill="#8338ec"/><path d="M592 147 H678" fill="none"/><circle cx="708" cy="147" r="17" fill="#06a77d"/></g></g><g id="test-four"><rect x="24" y="202" width="370" height="132" rx="20" fill="#ffffff" stroke="#06a77d" stroke-width="5"/><text x="48" y="230" font-family="sans-serif" font-size="28" fill="#2a1a4a">4: last two digits only</text><rect x="48" y="248" width="130" height="52" rx="12" fill="#ffb703" stroke="#2a1a4a" stroke-width="5"/><text x="113" y="284" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#2a1a4a">8536</text><path d="M190 274 H220" fill="none" stroke="#06a77d" stroke-width="7"/><path d="M214 266 L224 274 L214 282" fill="none" stroke="#06a77d" stroke-width="6"/><rect x="230" y="248" width="90" height="52" rx="12" fill="#06a77d" stroke="#2a1a4a" stroke-width="5"/><text x="275" y="284" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#2a1a4a">36</text><circle cx="351" cy="274" r="20" fill="#ffffff" stroke="#06a77d" stroke-width="5"/><path d="M341 274 L348 282 L362 264" fill="none" stroke="#06a77d" stroke-width="7"/></g><g id="test-eight"><rect x="410" y="202" width="366" height="132" rx="20" fill="#ffffff" stroke="#8338ec" stroke-width="5"/><text x="434" y="230" font-family="sans-serif" font-size="28" fill="#2a1a4a">8: last three digits</text><text x="434" y="261" font-family="sans-serif" font-size="28" fill="#2a1a4a">must make a multiple of 8</text><g stroke="#2a1a4a" stroke-width="4"><rect x="434" y="278" width="24" height="24" rx="5" fill="#3a86ff"/><rect x="466" y="278" width="24" height="24" rx="5" fill="#3a86ff"/><rect x="498" y="278" width="24" height="24" rx="5" fill="#3a86ff"/><rect x="530" y="278" width="24" height="24" rx="5" fill="#ffb703"/><rect x="562" y="278" width="24" height="24" rx="5" fill="#ffb703"/><rect x="594" y="278" width="24" height="24" rx="5" fill="#ffb703"/></g><path d="M626 290 H646" fill="none" stroke="#8338ec" stroke-width="6"/><path d="M640 282 L650 290 L640 298" fill="none" stroke="#8338ec" stroke-width="5"/><g fill="#06a77d" stroke="#2a1a4a" stroke-width="2"><circle cx="658" cy="290" r="6"/><circle cx="671" cy="290" r="6"/><circle cx="684" cy="290" r="6"/><circle cx="697" cy="290" r="6"/><circle cx="710" cy="290" r="6"/><circle cx="723" cy="290" r="6"/><circle cx="736" cy="290" r="6"/><circle cx="749" cy="290" r="6"/></g></g><g id="leap-years"><rect x="24" y="348" width="752" height="128" rx="20" fill="#ffffff" stroke="#ff7a59" stroke-width="5"/><text x="48" y="376" font-family="sans-serif" font-size="28" fill="#2a1a4a">Leap years: usually multiples of 4</text><rect x="60" y="394" width="260" height="64" rx="12" fill="#ffb703" stroke="#2a1a4a" stroke-width="5"/><g fill="#ff7a59" stroke="#2a1a4a" stroke-width="1"><circle cx="88" cy="407" r="4"/><circle cx="126" cy="407" r="4"/><circle cx="164" cy="407" r="4"/><circle cx="202" cy="407" r="4"/><circle cx="240" cy="407" r="4"/><circle cx="278" cy="407" r="4"/><circle cx="88" cy="418" r="4"/><circle cx="126" cy="418" r="4"/><circle cx="164" cy="418" r="4"/><circle cx="202" cy="418" r="4"/><circle cx="240" cy="418" r="4"/><circle cx="278" cy="418" r="4"/><circle cx="88" cy="429" r="4"/><circle cx="126" cy="429" r="4"/><circle cx="164" cy="429" r="4"/><circle cx="202" cy="429" r="4"/><circle cx="240" cy="429" r="4"/><circle cx="278" cy="429" r="4"/><circle cx="88" cy="440" r="4"/><circle cx="126" cy="440" r="4"/><circle cx="164" cy="440" r="4"/><circle cx="202" cy="440" r="4"/><circle cx="240" cy="440" r="4"/><circle cx="278" cy="440" r="4"/><circle cx="88" cy="451" r="4"/><circle cx="126" cy="451" r="4"/><circle cx="164" cy="451" r="4"/><circle cx="202" cy="451" r="4"/><circle cx="240" cy="451" r="4"/></g><path d="M330 426 H370" fill="none" stroke="#ff7a59" stroke-width="7"/><path d="M364 418 L374 426 L364 434" fill="none" stroke="#ff7a59" stroke-width="6"/><text x="380" y="414" font-family="sans-serif" font-size="28" fill="#2a1a4a"><tspan x="380" y="414">2024 is a leap year</tspan><tspan x="380" y="452">because February has 29 days</tspan></text></g></svg>