    <line x1="44" y1="108" x2="64" y2="108" stroke="#ff7a59" stroke-width="8" stroke-linecap="round"/>
    <text x="74" y="116" font-size="28">larger angle</text>
    <line x1="44" y1="152" x2="64" y2="152" stroke="#3a86ff" stroke-width="8" stroke-linecap="round"/>
    <text x="74" y="160" font-size="28">smaller angle</text>
    <path d="M220 192 L338 192" fill="none" stroke="#ff7a59" stroke-width="8" stroke-linecap="round"/>
    <path d="M220 192 L318 90" fill="none" stroke="#ff7a59" stroke-width="8" stroke-linecap="round"/>
    <path d="M220 192 L330 192" fill="none" stroke="#3a86ff" stroke-width="8" stroke-linecap="round"/>
    <path d="M220 192 L334 145" fill="none" stroke="#3a86ff" stroke-width="8" stroke-linecap="round"/>
    <path d="M280 192 A60 60 0 0 0 253 141" fill="none" stroke="#ffb703" stroke-width="7" stroke-linecap="round"/>
    <path d="M280 192 A60 60 0 0 0 274 165" fill="none" stroke="#06a77d" stroke-width="7" stroke-linecap="round"/>
    <circle cx="220" cy="192" r="9" fill="#ffb703" stroke="#2a1a4a" stroke-width="4"/>
  </g>
  <g font-family="sans-serif" fill="#2a1a4a">
    <rect x="406" y="24" width="370" height="220" rx="18" fill="#fffdf7"/>
    <text x="426" y="62" font-size="30" font-weight="700">Transparent circle</text>
    <circle cx="575" cy="100" r="15" fill="#3a86ff" fill-opacity="0.14" stroke="#3a86ff" stroke-width="5"/>
    <path d="M592 94 L620 80" fill="none" stroke="#ff7a59" stroke-width="6" stroke-linecap="round"/>
    <path d="M620 80 L607 79 L613 91 Z" fill="#ff7a59"/>
    <circle cx="690" cy="132" r="62" fill="#3a86ff" fill-opacity="0.14" stroke="#3a86ff" stroke-width="6"/>
