    <line x1="690" y1="132" x2="752" y2="132" stroke="#8338ec" stroke-width="8" stroke-linecap="round"/>
    <path d="M728 132 A38 38 0 0 0 719 108" fill="none" stroke="#ffb703" stroke-width="6" stroke-linecap="round"/>
    <circle cx="690" cy="132" r="7" fill="#ffb703" stroke="#2a1a4a" stroke-width="4"/>
    <circle cx="738" cy="92" r="7" fill="#06a77d" stroke="#2a1a4a" stroke-width="4"/>
    <circle cx="752" cy="132" r="7" fill="#06a77d" stroke="#2a1a4a" stroke-width="4"/>
    <text x="426" y="158" font-size="28">vertex centre</text>
    <text x="426" y="212" font-size="28">marks on circle</text>
  </g>
  <g font-family="sans-serif" fill="#2a1a4a">
    <rect x="24" y="266" width="752" height="210" rx="18" fill="#fffdf7"/>
    <text x="44" y="304" font-size="30" font-weight="700">Rotating arms</text>
    <line x1="135" y1="390" x2="225" y2="320" stroke="#ff7a59" stroke-width="8" stroke-linecap="round"/>
    <line x1="135" y1="390" x2="265" y2="390" stroke="#3a86ff" stroke-width="8" stroke-linecap="round"/>
