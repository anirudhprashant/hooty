    <line x1="410" y1="390" x2="470" y2="340" stroke="#ff7a59" stroke-width="8" stroke-linecap="round"/>
    <line x1="410" y1="390" x2="470" y2="390" stroke="#8338ec" stroke-width="6" stroke-dasharray="10 10" stroke-linecap="round"/>
    <path d="M442 332 A50 50 0 0 1 462 378" fill="none" stroke="#06a77d" stroke-width="6" stroke-linecap="round"/>
    <path d="M462 378 L450 375 L457 364 Z" fill="#06a77d"/>
    <circle cx="410" cy="390" r="7" fill="#ffb703" stroke="#2a1a4a" stroke-width="4"/>
    <line x1="600" y1="395" x2="710" y2="315" stroke="#2a1a4a" stroke-width="8" stroke-linecap="round"/>
    <line x1="600" y1="395" x2="710" y2="395" stroke="#2a1a4a" stroke-width="8" stroke-linecap="round"/>
    <line x1="600" y1="395" x2="710" y2="315" stroke="#ff7a59" stroke-width="5" stroke-linecap="round"/>
