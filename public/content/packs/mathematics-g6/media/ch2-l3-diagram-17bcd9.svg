<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Comparing angles and making rotating arms">
  <rect x="0" y="0" width="800" height="500" fill="#fff7e8"/>
  <g font-family="sans-serif" fill="#2a1a4a">
    <rect x="24" y="24" width="370" height="220" rx="18" fill="#fffdf7"/>
