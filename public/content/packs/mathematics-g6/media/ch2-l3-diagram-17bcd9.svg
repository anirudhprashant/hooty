    <path d="M650 395 A50 50 0 0 0 636 360" fill="none" stroke="#ffb703" stroke-width="6" stroke-linecap="round"/>
    <circle cx="600" cy="395" r="8" fill="#8338ec" stroke="#2a1a4a" stroke-width="4"/>
    <text x="44" y="445" font-size="28">two straws + paper clip</text>
    <text x="370" y="445" font-size="28">equal rotation</text>
    <text x="615" y="445" font-size="28">fits the slit</text>
